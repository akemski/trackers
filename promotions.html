<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dark Trackers • Promotions</title>

  <style>
    :root {
      --bg0: #050505;
      --bg1: #0b0b10;
      --panel: #101018;
      --panel2: #0e0e16;
      --line: #242436;
      --line2: #2b2b44;
      --text: #ececf4;
      --muted: #b8b8d2;

      --red: #c53f3f;
      --red2: #ff3b3b;

      --glow: 0 0 0 1px rgba(255,59,59,.3), 0 0 5px rgba(255,59,59,.15);
      --shadow: 0 14px 40px rgba(0,0,0,.45);
    }

    * { 
      box-sizing: border-box; 
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Courier New', Courier, monospace;
      color: var(--text);
      background:
        radial-gradient(900px 500px at 20% 0%, rgba(176,22,42,.15), transparent 55%),
        radial-gradient(700px 500px at 90% 20%, rgba(209,42,61,.1), transparent 55%),
        linear-gradient(180deg, var(--bg0), var(--bg1));
      min-height: 100vh;
      font-size: 15px;
      padding: 40px 20px;
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
    }

    /* Header */
    .header {
      background: var(--panel);
      border: 3px solid var(--line);
      padding: 30px;
      margin-bottom: 30px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 20px;
    }

    .header h1 {
      font-size: 38px;
      font-weight: 700;
      letter-spacing: 2px;
      text-transform: uppercase;
    }

    .back-btn {
      background: var(--panel);
      border: 3px solid var(--line);
      padding: 12px 24px;
      text-decoration: none;
      color: var(--text);
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1px;
      transition: all 0.2s;
      cursor: pointer;
      font-size: 14px;
    }

    .back-btn:hover {
      border-color: var(--red);
      background: var(--bg1);
    }

    /* Loading State */
    .loading {
      text-align: center;
      padding: 60px 20px;
      color: var(--muted);
      font-size: 18px;
    }

    .hidden {
      display: none !important;
    }

    /* Main Content */
    .content {
      display: flex;
      flex-direction: column;
      gap: 30px;
    }

    /* Progress Section */
    .progress-section {
      background: var(--panel);
      border: 4px solid var(--line);
      padding: 30px;
    }

    .current-rank {
      text-align: center;
      margin-bottom: 30px;
    }

    .current-rank h2 {
      font-size: 28px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 2px;
      margin-bottom: 10px;
    }

    .current-rank .rank-name {
      color: var(--red2);
      font-size: 36px;
    }

    .points-display {
      font-size: 18px;
      color: var(--muted);
      margin-top: 10px;
    }

    .points-display .current-points {
      color: var(--text);
      font-weight: 700;
      font-size: 24px;
    }

    /* Progress Bar */
    .progress-bar-container {
      margin: 30px 0;
    }

    .progress-info {
      display: flex;
      justify-content: space-between;
      margin-bottom: 10px;
      font-size: 14px;
      color: var(--muted);
    }

    .progress-bar {
      width: 100%;
      height: 30px;
      background: var(--bg1);
      border: 3px solid var(--line2);
      position: relative;
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--red), var(--red2));
      transition: width 0.5s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      font-weight: 700;
      color: white;
    }

    /* Ranks Overview */
    .ranks-overview {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 20px;
      margin-top: 30px;
    }

    .rank-card {
      background: var(--bg1);
      border: 3px solid var(--line2);
      padding: 20px;
      text-align: center;
      position: relative;
    }

    .rank-card.unlocked {
      border-color: var(--red);
    }

    .rank-card.current {
      background: linear-gradient(180deg, rgba(197,63,63,0.2), var(--bg1));
      border-color: var(--red2);
    }

    .rank-card h3 {
      font-size: 20px;
      font-weight: 700;
      text-transform: uppercase;
      margin-bottom: 10px;
    }

    .rank-card .points-required {
      font-size: 14px;
      color: var(--muted);
    }

    .rank-card .status {
      margin-top: 10px;
      font-size: 12px;
      font-weight: 700;
      text-transform: uppercase;
    }

    .rank-card.unlocked .status {
      color: var(--red2);
    }

    .rank-card.locked .status {
      color: var(--muted);
    }

    /* Admin Panel */
    .admin-panel {
      background: var(--panel);
      border: 4px solid var(--line);
      padding: 30px;
    }

    .admin-panel h2 {
      font-size: 24px;
      font-weight: 700;
      text-transform: uppercase;
      margin-bottom: 20px;
      color: var(--red2);
    }

    .admin-controls {
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .form-group label {
      font-size: 14px;
      font-weight: 700;
      text-transform: uppercase;
      color: var(--muted);
    }

    .form-group select,
    .form-group input {
      background: var(--bg1);
      border: 3px solid var(--line2);
      color: var(--text);
      padding: 12px;
      font-family: inherit;
      font-size: 15px;
    }

    .form-group input:focus,
    .form-group select:focus {
      outline: none;
      border-color: var(--red);
    }

    .admin-actions {
      display: flex;
      gap: 15px;
      margin-top: 20px;
    }

    .admin-btn {
      background: var(--red);
      border: 3px solid var(--red);
      color: white;
      padding: 12px 24px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1px;
      cursor: pointer;
      font-family: inherit;
      font-size: 14px;
      transition: all 0.2s;
    }

    .admin-btn:hover {
      background: var(--red2);
    }

    .admin-btn.secondary {
      background: var(--panel);
      border-color: var(--line);
      color: var(--text);
    }

    .admin-btn.secondary:hover {
      border-color: var(--red);
      background: var(--bg1);
    }

    /* Footer */
    .footer-note {
      margin-top: 30px;
      color: rgba(184, 184, 210, 0.6);
      font-size: 11px;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      font-weight: 300;
      text-align: center;
    }

    @media (max-width: 768px) {
      .header {
        text-align: center;
        justify-content: center;
      }

      .header h1 {
        font-size: 28px;
      }

      .admin-actions {
        flex-direction: column;
      }
    }
  </style>
</head>

<body>
  <div class="container">
    <!-- Header -->
    <header class="header">
      <h1>Promotion System</h1>
      <a href="profile.html" class="back-btn">← Zurück zum Profil</a>
    </header>

    <!-- Loading State -->
    <div class="loading" id="loadingState">
      Lade Promotion-Daten...
    </div>

    <!-- Main Content -->
    <div class="content hidden" id="mainContent">
      <!-- User Progress Section -->
      <section class="progress-section">
        <div class="current-rank">
          <h2>Dein aktueller Rang:</h2>
          <div class="rank-name" id="currentRankName">-</div>
          <div class="points-display">
            <span class="current-points" id="currentPoints">0</span> Punkte
          </div>
        </div>

        <!-- Progress Bar -->
        <div class="progress-bar-container" id="progressContainer">
          <div class="progress-info">
            <span id="progressFrom">0 Punkte</span>
            <span id="progressTo">500 Punkte bis INITIATE</span>
          </div>
          <div class="progress-bar">
            <div class="progress-fill" id="progressFill" style="width: 0%">
              <span id="progressPercent">0%</span>
            </div>
          </div>
        </div>

        <!-- Ranks Overview -->
        <div class="ranks-overview" id="ranksOverview">
          <!-- Will be populated by JavaScript -->
        </div>
      </section>

      <!-- Admin Panel -->
      <section class="admin-panel hidden" id="adminPanel">
        <h2>⚙️ Admin Panel - Punkte vergeben</h2>
        
        <div class="admin-controls">
          <div class="form-group">
            <label for="selectMember">Member auswählen:</label>
            <select id="selectMember">
              <option value="">-- Member wählen --</option>
            </select>
          </div>

          <div class="form-group">
            <label for="pointsAmount">Punkte (+ oder -):</label>
            <input 
              type="number" 
              id="pointsAmount" 
              placeholder="z.B. 50 oder -25"
              value="50"
            />
          </div>

          <div class="form-group">
            <label for="pointsReason">Grund (optional):</label>
            <input 
              type="text" 
              id="pointsReason" 
              placeholder="z.B. Event-Teilnahme, Training, etc."
            />
          </div>
        </div>

        <div class="admin-actions">
          <button class="admin-btn" id="awardPointsBtn">Punkte Vergeben</button>
          <button class="admin-btn secondary" id="refreshBtn">Liste Aktualisieren</button>
        </div>
      </section>
    </div>

    <!-- Footer -->
    <footer class="footer-note">
      All actions logged • Protocol DT-01 • Compartmentalized access
    </footer>
  </div>

  <!-- Firebase -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

  <script>
    // Firebase Config
    const firebaseConfig = {
      apiKey: "AIzaSyASTwGk7GYqOaDWTRB77Qw5aE_RnWzcHic",
      authDomain: "trackers-ce3fb.firebaseapp.com",
      projectId: "trackers-ce3fb",
      storageBucket: "trackers-ce3fb.firebasestorage.app",
      messagingSenderId: "385800199430",
      appId: "1:385800199430:web:93fe876ed4dfc6550a9287",
      measurementId: "G-VXYWY0ELKF"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    // RANKS configuration
    const RANKS = [
      { name: 'SHARD', points: 0 },
      { name: 'INITIATE', points: 500 },
      { name: 'AXIS', points: 1000 },
      { name: 'EXECUTOR', points: 1500 }
    ];

    // DOM Elements
    const loadingState = document.getElementById('loadingState');
    const mainContent = document.getElementById('mainContent');
    const currentRankName = document.getElementById('currentRankName');
    const currentPoints = document.getElementById('currentPoints');
    const progressContainer = document.getElementById('progressContainer');
    const progressFrom = document.getElementById('progressFrom');
    const progressTo = document.getElementById('progressTo');
    const progressFill = document.getElementById('progressFill');
    const progressPercent = document.getElementById('progressPercent');
    const ranksOverview = document.getElementById('ranksOverview');
    const adminPanel = document.getElementById('adminPanel');
    const selectMember = document.getElementById('selectMember');
    const pointsAmount = document.getElementById('pointsAmount');
    const pointsReason = document.getElementById('pointsReason');
    const awardPointsBtn = document.getElementById('awardPointsBtn');
    const refreshBtn = document.getElementById('refreshBtn');

    // State
    let currentUser = null;
    let currentUserDoc = null;
    let allMembers = [];

    // Check Login
    const username = localStorage.getItem('clubUser');
    const role = localStorage.getItem('clubRole');
    
    if (!username) {
      window.location.href = 'index.html';
    }

    // Normalize role
    function normalizeRole(r) {
      const normalized = (r || "").toLowerCase().trim();
      return normalized === "admin" ? "admin" : normalized;
    }

    const isAdmin = normalizeRole(role) === 'admin';
    const isLeader = normalizeRole(role) === 'leader';

    // Get Current Rank
    function getCurrentRank(points) {
      for (let i = RANKS.length - 1; i >= 0; i--) {
        if (points >= RANKS[i].points) {
          return RANKS[i];
        }
      }
      return RANKS[0];
    }

    // Get Next Rank
    function getNextRank(currentRank) {
      const currentIndex = RANKS.findIndex(r => r.name === currentRank.name);
      if (currentIndex < RANKS.length - 1) {
        return RANKS[currentIndex + 1];
      }
      return null;
    }

    // Update Progress Display
    function updateProgressDisplay(points) {
      // Special view for Leaders (Vicar rank)
      if (isLeader) {
        currentRankName.textContent = 'VICAR';
        currentPoints.textContent = points;
        
        // Hide progress bar for leaders
        progressContainer.innerHTML = `
          <div style="text-align: center; padding: 20px; color: var(--red2); font-weight: 700; font-size: 16px;">
            Als Leader hast du den festen Rang VICAR.
          </div>
        `;
        return;
      }

      // Normal member progression
      const rank = getCurrentRank(points);
      const nextRank = getNextRank(rank);

      currentRankName.textContent = rank.name;
      currentPoints.textContent = points;

      if (nextRank) {
        const pointsInCurrentRank = points - rank.points;
        const pointsNeededForNext = nextRank.points - rank.points;
        const progressPercentValue = (pointsInCurrentRank / pointsNeededForNext) * 100;

        progressFrom.textContent = `${rank.points} Punkte`;
        progressTo.textContent = `${nextRank.points} Punkte bis ${nextRank.name}`;
        progressFill.style.width = `${progressPercentValue}%`;
        progressFill.querySelector('span').textContent = `${Math.round(progressPercentValue)}%`;
        progressContainer.classList.remove('hidden');
      } else {
        // Max rank reached
        progressContainer.innerHTML = `
          <div style="text-align: center; padding: 20px; color: var(--red2); font-weight: 700; font-size: 18px;">
            🎉 MAXIMALER RANG ERREICHT! 🎉
          </div>
        `;
      }
    }

    // Display Ranks Overview
    function displayRanksOverview(userPoints) {
      ranksOverview.innerHTML = '';
      
      // Leaders don't see the ranks overview
      if (isLeader) {
        ranksOverview.innerHTML = `
          <div style="text-align: center; padding: 40px; color: var(--muted); grid-column: 1 / -1;">
            <p style="font-size: 16px; margin-bottom: 10px;">Als VICAR verwaltest du das Team.</p>
            <p style="font-size: 14px;">Deine Punkte werden für Statistiken erfasst.</p>
          </div>
        `;
        return;
      }

      // Normal member view
      RANKS.forEach((rank, index) => {
        const card = document.createElement('div');
        card.className = 'rank-card';
        
        const isUnlocked = userPoints >= rank.points;
        const currentRank = getCurrentRank(userPoints);
        const isCurrent = rank.name === currentRank.name;

        if (isUnlocked) card.classList.add('unlocked');
        if (isCurrent) card.classList.add('current');
        if (!isUnlocked) card.classList.add('locked');

        let statusText = '';
        if (isCurrent) statusText = '• Aktueller Rang •';
        else if (isUnlocked) statusText = '✓ Freigeschaltet';
        else statusText = '🔒 Gesperrt';

        card.innerHTML = `
          <h3>${rank.name}</h3>
          <div class="points-required">${rank.points} Punkte</div>
          <div class="status">${statusText}</div>
        `;

        ranksOverview.appendChild(card);
      });
    }

    // Load User Data
    async function loadUserData() {
      try {
        const snap = await db.collection('users')
          .where('username', '==', username)
          .limit(1)
          .get();

        if (snap.empty) {
          alert('User nicht gefunden!');
          window.location.href = 'index.html';
          return;
        }

        const doc = snap.docs[0];
        currentUserDoc = doc.id;
        currentUser = doc.data();

        const points = currentUser.promotionPoints || 0;

        updateProgressDisplay(points);
        displayRanksOverview(points);

        // Show admin panel if admin
        if (isAdmin) {
          adminPanel.classList.remove('hidden');
          await loadAllMembers();
        }

        loadingState.classList.add('hidden');
        mainContent.classList.remove('hidden');

      } catch (error) {
        console.error('Fehler beim Laden:', error);
        loadingState.innerHTML = 'Fehler beim Laden der Daten!';
      }
    }

    // Load All Members (for Admin)
    async function loadAllMembers() {
      try {
        const snapshot = await db.collection('users').get();
        allMembers = [];
        
        selectMember.innerHTML = '<option value="">-- Member wählen --</option>';
        
        snapshot.forEach(doc => {
          const data = doc.data();
          allMembers.push({ id: doc.id, ...data });
          
          const displayName = data.displayName || data.username;
          const points = data.promotionPoints || 0;
          const option = document.createElement('option');
          option.value = doc.id;
          option.textContent = `${displayName} (${points} Punkte)`;
          selectMember.appendChild(option);
        });

      } catch (error) {
        console.error('Fehler beim Laden der Members:', error);
      }
    }

    // Award Points (Admin only)
    awardPointsBtn.addEventListener('click', async () => {
      // Double-check admin status
      if (!isAdmin) {
        alert('⛔ Keine Berechtigung! Nur Admins können Punkte vergeben.');
        return;
      }

      const memberId = selectMember.value;
      const points = parseInt(pointsAmount.value);
      const reason = pointsReason.value.trim();

      if (!memberId) {
        alert('Bitte einen Member auswählen!');
        return;
      }

      if (isNaN(points) || points === 0) {
        alert('Bitte eine gültige Punktzahl eingeben!');
        return;
      }

      try {
        const memberDoc = await db.collection('users').doc(memberId).get();
        const memberData = memberDoc.data();
        const currentPointsValue = memberData.promotionPoints || 0;
        const newPoints = Math.max(0, currentPointsValue + points);

        await db.collection('users').doc(memberId).update({
          promotionPoints: newPoints
        });

        alert(`${points > 0 ? '+' : ''}${points} Punkte erfolgreich vergeben!\n${memberData.displayName || memberData.username}: ${currentPointsValue} → ${newPoints} Punkte`);

        // Reset form
        pointsAmount.value = '50';
        pointsReason.value = '';
        
        // Reload if viewing own profile
        if (memberId === currentUserDoc) {
          await loadUserData();
        } else {
          await loadAllMembers();
        }

      } catch (error) {
        console.error('Fehler beim Vergeben der Punkte:', error);
        alert('Fehler beim Vergeben der Punkte!');
      }
    });

    // Refresh Button
    refreshBtn.addEventListener('click', async () => {
      await loadAllMembers();
      alert('Member-Liste aktualisiert!');
    });

    // Load data on page load
    loadUserData();
  </script>
</body>
</html>
